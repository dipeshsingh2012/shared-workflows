name: Reusable Vercel Deployment

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Working directory containing the frontend (e.g. frontend or .)'
        required: false
        default: '.'
        type: string
      production:
        description: 'Deploy directly to production (true) or preview (false)'
        required: false
        default: true
        type: boolean
      node_version:
        description: 'Node.js runtime version'
        required: false
        default: '20'
        type: string
      build_command:
        description: 'Custom build command (optional)'
        required: false
        default: ''
        type: string
    secrets:
      VERCEL_TOKEN:
        description: 'Vercel authentication token'
        required: true
      VERCEL_ORG_ID:
        description: 'Vercel Organization ID'
        required: false
      VERCEL_PROJECT_ID:
        description: 'Vercel Project ID'
        required: false
    outputs:
      url:
        description: 'Live deployment URL'
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [ "${{ inputs.production }}" = "true" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [ -n "${{ inputs.build_command }}" ]; then
            ${{ inputs.build_command }}
          fi
          if [ "${{ inputs.production }}" = "true" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [ "${{ inputs.production }}" = "true" ]; then
            OUTPUT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            OUTPUT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "Vercel Deployment URL: $OUTPUT_URL"
          echo "url=$OUTPUT_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
