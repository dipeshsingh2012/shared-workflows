name: Reusable MFE GCS Deployment

on:
  workflow_call:
    inputs:
      dest_dir:
        description: 'Destination directory inside GCS bucket (e.g. mfes/testimonials-ui)'
        required: true
        type: string
      bucket:
        description: 'Target Google Cloud Storage bucket name'
        required: false
        default: 'mycommerce'
        type: string
      node_version:
        description: 'Node.js version'
        required: false
        default: '20'
        type: string
      build_command:
        description: 'Build script to execute'
        required: false
        default: 'npm run build'
        type: string
      dist_dir:
        description: 'Output directory containing production build'
        required: false
        default: 'dist'
        type: string
      cache_control_remote_entry:
        description: 'Cache-Control header for remoteEntry.js'
        required: false
        default: 'no-cache, no-store, must-revalidate'
        type: string
      cache_control_html:
        description: 'Cache-Control header for index.html'
        required: false
        default: 'no-cache, no-store, must-revalidate'
        type: string
    secrets:
      gcp_sa_key:
        description: 'GCP Service Account JSON Key'
        required: false
      gcp_workload_identity_provider:
        description: 'GCP Workload Identity Provider ID'
        required: false
      gcp_service_account:
        description: 'GCP Service Account email (used with Workload Identity)'
        required: false

jobs:
  deploy:
    name: Build & Deploy to GCS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Found package-lock.json. Running npm ci..."
            npm ci
          else
            echo "No package-lock.json found. Running npm install..."
            npm install
          fi

      - name: Build MFE Bundle
        run: ${{ inputs.build_command }}

      - name: Verify GCP Authentication Secrets
        env:
          GCP_SA_KEY: ${{ secrets.gcp_sa_key }}
          WIF_PROVIDER: ${{ secrets.gcp_workload_identity_provider }}
        run: |
          if [ -z "$GCP_SA_KEY" ] && [ -z "$WIF_PROVIDER" ]; then
            echo "::error::No GCP credentials supplied! Please pass 'gcp_sa_key' or 'gcp_workload_identity_provider' in secrets."
            exit 1
          fi
          echo "Valid GCP credentials supplied."

      - name: Authenticate to Google Cloud (Service Account Key)
        if: ${{ secrets.gcp_sa_key != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.gcp_sa_key }}

      - name: Authenticate to Google Cloud (Workload Identity)
        if: ${{ secrets.gcp_sa_key == '' && secrets.gcp_workload_identity_provider != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.gcp_workload_identity_provider }}
          service_account: ${{ secrets.gcp_service_account }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Storage
        env:
          TARGET_BUCKET: ${{ inputs.bucket }}
          TARGET_DIR: ${{ inputs.dest_dir }}
          DIST_DIR: ${{ inputs.dist_dir }}
          REMOTE_CACHE: ${{ inputs.cache_control_remote_entry }}
          HTML_CACHE: ${{ inputs.cache_control_html }}
        run: |
          DEST="gs://${TARGET_BUCKET}/${TARGET_DIR}"
          echo "============================================================"
          echo "Syncing ${DIST_DIR}/ to ${DEST}/"
          echo "============================================================"
          
          # 1. Sync all assets, deleting orphaned files
          gcloud storage rsync "${DIST_DIR}/" "${DEST}/" \
            --recursive \
            --delete-unmatched-destination-objects

          # 2. Update cache control for remoteEntry.js so consumers always pull latest version
          if [ -f "${DIST_DIR}/assets/remoteEntry.js" ]; then
            echo "Setting cache header on remoteEntry.js: ${REMOTE_CACHE}"
            gcloud storage objects update "${DEST}/assets/remoteEntry.js" \
              --cache-control="${REMOTE_CACHE}"
          fi

          # 3. Update cache control for index.html if present
          if [ -f "${DIST_DIR}/index.html" ]; then
            echo "Setting cache header on index.html: ${HTML_CACHE}"
            gcloud storage objects update "${DEST}/index.html" \
              --cache-control="${HTML_CACHE}"
          fi

          echo "============================================================"
          echo "Deployment successful!"
          echo "Bucket URL:       ${DEST}"
          echo "Public Entry URL: https://storage.googleapis.com/${TARGET_BUCKET}/${TARGET_DIR}/assets/remoteEntry.js"
          echo "============================================================"
