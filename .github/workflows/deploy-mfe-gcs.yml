name: Reusable MFE GCS Deployment

on:
  workflow_call:
    inputs:
      dest_dir:
        description: 'Destination directory inside GCS bucket (e.g. mfes/testimonials-ui)'
        required: true
        type: string
      bucket:
        description: 'Target Google Cloud Storage bucket name'
        required: false
        default: 'mycommerce'
        type: string
      node_version:
        description: 'Node.js version'
        required: false
        default: '20'
        type: string
      build_command:
        description: 'Build script to execute'
        required: false
        default: 'npm run build'
        type: string
      dist_dir:
        description: 'Output directory containing production build'
        required: false
        default: 'dist'
        type: string
      cache_control_remote_entry:
        description: 'Cache-Control header for remoteEntry.js'
        required: false
        default: 'no-cache, no-store, must-revalidate'
        type: string
      cache_control_html:
        description: 'Cache-Control header for index.html'
        required: false
        default: 'no-cache, no-store, must-revalidate'
        type: string
      workload_identity_provider:
        description: 'GCP Workload Identity Provider resource URI (Default: Hiljhil/MyCommerce GitHub pool)'
        required: false
        default: 'projects/518971663061/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
        type: string
      service_account:
        description: 'GCP Service Account to impersonate via Workload Identity'
        required: false
        default: 'gh-actions-deployer@mycommerce-508208.iam.gserviceaccount.com'
        type: string
    secrets:
      gcp_sa_key:
        description: 'Optional GCP Service Account JSON Key (fallback if not using Workload Identity)'
        required: false

jobs:
  deploy:
    name: Build & Deploy to GCS
    runs-on: ubuntu-latest
    env:
      GCP_SA_KEY: ${{ secrets.gcp_sa_key }}
      WIF_PROVIDER: ${{ inputs.workload_identity_provider }}
      WIF_SA: ${{ inputs.service_account }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "Found package-lock.json. Running npm ci..."
            npm ci
          else
            echo "No package-lock.json found. Running npm install..."
            npm install
          fi

      - name: Build MFE Bundle
        run: ${{ inputs.build_command }}

      - name: Authenticate to Google Cloud (Workload Identity Federation - Keyless)
        if: ${{ env.GCP_SA_KEY == '' && env.WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Authenticate to Google Cloud (Service Account Key Fallback)
        if: ${{ env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Storage
        env:
          TARGET_BUCKET: ${{ inputs.bucket }}
          TARGET_DIR: ${{ inputs.dest_dir }}
          DIST_DIR: ${{ inputs.dist_dir }}
          REMOTE_CACHE: ${{ inputs.cache_control_remote_entry }}
          HTML_CACHE: ${{ inputs.cache_control_html }}
        run: |
          DEST="gs://${TARGET_BUCKET}/${TARGET_DIR}"
          echo "============================================================"
          echo "Syncing ${DIST_DIR}/ to ${DEST}/"
          echo "============================================================"
          
          # 1. Sync all assets, deleting orphaned files
          gcloud storage rsync "${DIST_DIR}/" "${DEST}/" \
            --recursive \
            --delete-unmatched-destination-objects

          # 2. Update cache control for remoteEntry.js so consumers always pull latest version
          if [ -f "${DIST_DIR}/assets/remoteEntry.js" ]; then
            echo "Setting cache header on remoteEntry.js: ${REMOTE_CACHE}"
            gcloud storage objects update "${DEST}/assets/remoteEntry.js" \
              --cache-control="${REMOTE_CACHE}"
          fi

          # 3. Update cache control for index.html if present
          if [ -f "${DIST_DIR}/index.html" ]; then
            echo "Setting cache header on index.html: ${HTML_CACHE}"
            gcloud storage objects update "${DEST}/index.html" \
              --cache-control="${HTML_CACHE}"
          fi

          echo "============================================================"
          echo "Deployment successful via Workload Identity!"
          echo "Bucket URL:       ${DEST}"
          echo "Public Entry URL: https://storage.googleapis.com/${TARGET_BUCKET}/${TARGET_DIR}/assets/remoteEntry.js"
          echo "============================================================"
