name: Reusable Database Migration & Seed

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python runtime version'
        required: false
        default: '3.11'
        type: string
      migration_action:
        description: 'Alembic action (upgrade, current, history)'
        required: false
        default: 'upgrade'
        type: string
      run_seed:
        description: 'Whether to execute seed script after migration'
        required: false
        default: true
        type: boolean
      seed_command:
        description: 'Seed script execution command'
        required: false
        default: 'python -m src.db.seed'
        type: string
    secrets:
      SQL_DB:
        description: 'PostgreSQL connection URL (Neon / Cloud SQL)'
        required: true

jobs:
  migrate:
    name: Run Alembic Migration & Seed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          if ! command -v alembic &> /dev/null; then
            pip install alembic asyncpg psycopg2-binary
          fi

      - name: Verify Database Secret
        env:
          SQL_DB: ${{ secrets.SQL_DB }}
        run: |
          if [ -z "$SQL_DB" ]; then
            echo "::error::SQL_DB secret is not configured in GitHub repository secrets. Please add SQL_DB under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Database secret is verified."

      - name: Run Alembic Migration
        env:
          SQL_DB: ${{ secrets.SQL_DB }}
          DATABASE_URL: ${{ secrets.SQL_DB }}
        run: |
          case "${{ inputs.migration_action }}" in
            "current")
              alembic current
              ;;
            "history")
              alembic history --verbose
              ;;
            *)
              alembic upgrade head
              ;;
          esac

      - name: Run Database Seed Script
        if: ${{ inputs.run_seed }}
        env:
          SQL_DB: ${{ secrets.SQL_DB }}
          DATABASE_URL: ${{ secrets.SQL_DB }}
        run: |
          ${{ inputs.seed_command }}
